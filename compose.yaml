services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartdesk
    ports:
      - "5433:5432"
    volumes:
      - smartdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartdesk"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  smartdesk_pgdata:
